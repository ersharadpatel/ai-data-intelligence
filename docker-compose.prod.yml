
services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile.prod

    container_name: ai_data_intelligence_prod

    ports:
      - "127.0.0.1:8001:8001"

    volumes:
      - ai_data:/workspace/data
      - ai_models:/workspace/models

    restart: unless-stopped
    init: true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai_data:
  ai_models:
